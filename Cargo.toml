[package]
name = "nannou_studies"
version = "0.1.0"
edition = "2024"

[dependencies]
bevy = { version = "0.19", features = ["dynamic_linking"] }
# nannou = "0.20"
nannou = { version = "0.20", git = "https://github.com/ffunatsu/nannou", branch="main"}

[profile.dev]
opt-level = 1
[profile.dev.package."*"]
opt-level = 3
