[package]
name = "nannou_studies"
version = "0.1.0"
edition = "2024"

[features]
hot_reload = ["nannou/hot_reload"]

[dependencies]
bevy = { version = "0.19", features = ["dynamic_linking"] }
# nannou = "0.20"
# nannou = { version = "0.20", git = "https://github.com/ffunatsu/nannou", branch="main"}
nannou = { package = "nannou_dynamic", path = "./nannou_dynamic" }
# hot-lib-reloader = "^0.8.2"

[profile.dev]
opt-level = 1
[profile.dev.package."*"]
opt-level = 3
